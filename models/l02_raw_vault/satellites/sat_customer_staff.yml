version: 2

models:
  - name: sat_customer_staff
    description: "Staff number for customers who are also bank staff, historized."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - customer_hk
            - load_dts
    columns:
      - name: customer_hk
        tests:
          - not_null
          - relationships:
              to: ref('hub_customer')
              field: customer_hk
      - name: load_dts
        tests:
          - not_null
      - name: staff_hashdiff
        tests:
          - not_null
      - name: source
        tests:
          - not_null