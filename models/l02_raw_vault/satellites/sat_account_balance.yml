version: 2

models:
  - name: sat_account_balance
    description: "Non-historized balance snapshot, insert-only. Grain is one row per account version."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - account_hk
            - load_dts
            - curr_no
    columns:
      - name: account_hk
        tests:
          - not_null
          - relationships:
              to: ref('hub_account')
              field: account_hk
      - name: load_dts
        tests:
          - not_null
      - name: curr_no
        tests:
          - not_null
      - name: record_source
        tests:
          - not_null